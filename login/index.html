<!-- 🌟 运行时间JS（DOM加载后执行） -->
    <script>
        function updateRuntime() {
            // 🔴【重要】请在这里修改您的建站日期（格式：年/月/日 时:分:秒）
            var startTime = new Date('2026/10/07 00:00:00'); 
            
            // 获取当前时间
            var now = new Date();
            
            // 计算时间差（毫秒）
            var difference = now - startTime;
            
            // 计算天数、小时、分钟、秒
            var days = Math.floor(difference / (1000 * 60 * 60 * 24));
            var hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            var minutes = Math.floor((difference / (1000 * 60)) % 60);
            var seconds = Math.floor((difference / 1000) % 60);
            
            // 拼接字符串
            var result = days + "天" + 
                         hours + "小时" + 
                         minutes + "分钟" + 
                         seconds + "秒";
            
            // 更新网页显示
            document.getElementById('site-runtime').innerHTML = result;
        }

        // 立即执行一次，避免加载时有延迟
        updateRuntime();
        
        // 每隔 1 秒刷新一次
        setInterval(updateRuntime, 1000);
    </script>

            try {
                var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
                isBack = !!nav && nav.type === 'back_forward';
            } catch (err) {}
            if (!isBack) return;
            try {
                var y = parseInt(sessionStorage.getItem(KEY) || '0', 10);
                if (y > 0) {
                    requestAnimationFrame(function () { window.scrollTo(0, y); });
                }
            } catch (err2) {}
        });

        /* ---------- 2. 回到顶部按钮（移动端专用，样式在 style.css 里） ---------- */
        if (!document.querySelector('.yekjw-backtop')) {
            var btn = document.createElement('button');
            btn.className = 'yekjw-backtop';
            btn.type = 'button';
            btn.setAttribute('aria-label', '回到顶部');
            btn.innerHTML = '&#8593;';
            btn.addEventListener('click', function () {
                if ('scrollBehavior' in document.documentElement.style) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    window.scrollTo(0, 0); /* 老 iOS Safari 兜底 */
                }
            });
            var toggle = function () {
                if (window.scrollY > window.innerHeight) { btn.classList.add('show'); }
                else { btn.classList.remove('show'); }
            };
            window.addEventListener('scroll', toggle, { passive: true });
            document.body.appendChild(btn);
            toggle();
        }

        /* ---------- 3. 顶栏换行后实测高度，动态调整 body 顶部留空 ---------- */
        function adjustHeaderSpace() {
            var h = document.querySelector('.site-header');
            if (!h) return;
            if (window.innerWidth <= 768) {
                document.body.style.paddingTop = (h.offsetHeight + 12) + 'px';
            } else {
                document.body.style.paddingTop = ''; /* 桌面端恢复原来的 110px */
            }
        }
        window.addEventListener('resize', adjustHeaderSpace);
        window.addEventListener('orientationchange', adjustHeaderSpace);
        window.addEventListener('load', adjustHeaderSpace);
        adjustHeaderSpace();
        setTimeout(adjustHeaderSpace, 800); /* 延迟再校一次，确保布局稳定 */
    })();
    </script>
</body>
</html>
